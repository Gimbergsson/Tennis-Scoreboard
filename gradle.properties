# Project-wide Gradle settings.

# Experiment with the JVM parallel garbage collector
# https://developer.android.com/build/optimize-your-build?utm_source=android-studio-app&utm_medium=app#experiment-with-the-jvm-parallel-garbage-collector

# Increase the JVM heap size
# https://developer.android.com/build/optimize-your-build?utm_source=android-studio-app&utm_medium=app#increase-the-jvm-heap-size
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.unsafe.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true
android.dependency.useConstraints=true
android.disallowKotlinSourceSets=false
android.experimental.enableTestFixturesKotlinSupport=true
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
android.nonTransitiveRClass=false
android.r8.strictFullModeForKeepRules=false
android.uniquePackageNames=false